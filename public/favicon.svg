<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>
  <!-- Glowing Monogram PT -->
  <path d="M 16 20 H 32 C 37 20 40 23 40 27 C 40 31 37 34 32 34 H 23 V 46 H 16 V 20 Z M 23 26 V 29 H 31 C 32.5 29 33.5 28 33.5 27.5 C 33.5 27 32.5 26 31 26 H 23 Z" fill="url(#ptGrad)" filter="url(#glow)"/>
  <path d="M 36 26 H 50 V 31 H 45.5 V 46 H 40.5 V 31 H 36 V 26 Z" fill="url(#ptGrad)" filter="url(#glow)"/>
</svg>
