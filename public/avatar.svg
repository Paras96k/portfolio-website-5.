<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8d7b8" />
      <stop offset="100%" stop-color="#e2ab80" />
    </linearGradient>

    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#0d0e15" />
    </linearGradient>

    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background circle glow -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarGlow)" />
  
  <!-- Outer decorative tech border ring -->
  <circle cx="200" cy="200" r="185" stroke="url(#accentBorder)" stroke-width="3" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="200" cy="200" r="172" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Background Base Container -->
  <circle cx="200" cy="200" r="170" fill="#090d16" />

  <!-- Code/Matrix Grid Pattern Elements -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="60" y1="120" x2="340" y2="120" stroke-dasharray="4 4" />
    <line x1="60" y1="200" x2="340" y2="200" stroke-dasharray="4 4" />
    <line x1="60" y1="280" x2="340" y2="280" stroke-dasharray="4 4" />
    <line x1="120" y1="60" x2="120" y2="340" stroke-dasharray="4 4" />
    <line x1="280" y1="60" x2="280" y2="340" stroke-dasharray="4 4" />
  </g>

  <!-- Developer Silhouette / Character -->
  <g id="developer">
    <!-- Torso / Hoodie -->
    <path d="M 100 370 C 100 295 130 265 200 265 C 270 265 300 295 300 370 Z" fill="url(#hoodieGrad)" />
    <!-- Hoodie Inner Collar -->
    <path d="M 160 265 C 160 295 180 320 200 320 C 220 320 240 295 240 265 Z" fill="#1e1b4b" opacity="0.7"/>
    <!-- T-shirt / V-neck -->
    <path d="M 180 265 L 200 300 L 220 265 Z" fill="#0f172a" />

    <!-- Neck -->
    <rect x="182" y="220" width="36" height="50" rx="10" fill="url(#skinGrad)" />
    <!-- Neck shadow -->
    <path d="M 182 245 C 190 252 210 252 218 245 L 218 255 L 182 255 Z" fill="#caa07a" opacity="0.6"/>

    <!-- Head -->
    <rect x="150" y="115" width="100" height="120" rx="48" fill="url(#skinGrad)" />

    <!-- Ears -->
    <circle cx="148" cy="175" r="14" fill="#e2ab80" />
    <circle cx="252" cy="175" r="14" fill="#e2ab80" />
    <circle cx="148" cy="175" r="8" fill="#caa07a" opacity="0.6"/>
    <circle cx="252" cy="175" r="8" fill="#caa07a" opacity="0.6"/>

    <!-- Hair -->
    <path d="M 144 140 C 144 95 170 80 200 80 C 235 80 258 95 258 140 C 258 145 254 130 240 120 C 220 105 180 105 160 120 C 150 128 144 140 144 140 Z" fill="url(#hairGrad)" />
    <!-- Modern hairstyle texture strokes -->
    <path d="M 155 105 C 175 90 205 92 225 102" stroke="#2e2e38" stroke-width="4" stroke-linecap="round"/>
    <path d="M 170 88 C 190 82 215 84 235 94" stroke="#3d3d4b" stroke-width="3" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M 165 158 Q 178 152 190 156" stroke="#1f242d" stroke-width="4" stroke-linecap="round" />
    <path d="M 210 156 Q 222 152 235 158" stroke="#1f242d" stroke-width="4" stroke-linecap="round" />

    <!-- Eyes -->
    <ellipse cx="178" cy="170" rx="5" ry="6" fill="#1e293b" />
    <ellipse cx="222" cy="170" rx="5" ry="6" fill="#1e293b" />
    <circle cx="180" cy="168" r="1.8" fill="#ffffff" />
    <circle cx="224" cy="168" r="1.8" fill="#ffffff" />

    <!-- Modern Smart Glasses -->
    <rect x="160" y="156" width="34" height="26" rx="8" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <rect x="206" y="156" width="34" height="26" rx="8" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="194" y1="168" x2="206" y2="168" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Glasses lens sheen -->
    <path d="M 164 162 L 180 178" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 210 162 L 226 178" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Nose -->
    <path d="M 200 175 L 197 190 L 204 190" stroke="#c0936f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Confident Warm Smile -->
    <path d="M 188 206 Q 200 216 212 206" stroke="#995a3a" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Developer Headphones Around Neck -->
    <path d="M 140 230 C 140 270 260 270 260 230" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <rect x="130" y="210" width="16" height="32" rx="6" fill="#38bdf8" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="254" y="210" width="16" height="32" rx="6" fill="#38bdf8" stroke="#0ea5e9" stroke-width="1.5"/>

    <!-- Glowing Tech Laptop at Bottom -->
    <path d="M 125 345 L 275 345 L 260 375 L 140 375 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="200" cy="358" rx="8" ry="4" fill="#38bdf8" filter="url(#softGlow)" opacity="0.8"/>
  </g>

  <!-- Floating Tech Badges (AI / Security / Web) -->
  <!-- AI / Brain Chip Badge -->
  <g transform="translate(60, 140)" filter="url(#softGlow)">
    <circle cx="20" cy="20" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 14 18 L 26 18 M 14 22 L 26 22 M 20 14 L 20 26" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="3" fill="#38bdf8" />
  </g>

  <!-- Security Shield Badge -->
  <g transform="translate(300, 140)" filter="url(#softGlow)">
    <circle cx="20" cy="20" r="22" fill="#0f172a" stroke="#818cf8" stroke-width="2"/>
    <path d="M 20 12 L 28 15 V 21 C 28 26 24 29 20 31 C 16 29 12 26 12 21 V 15 Z" fill="none" stroke="#818cf8" stroke-width="2"/>
    <path d="M 17 21 L 19 23 L 24 18" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Code Bracket Badge -->
  <g transform="translate(70, 270)" filter="url(#softGlow)">
    <circle cx="18" cy="18" r="18" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
    <path d="M 15 14 L 11 18 L 15 22 M 21 14 L 25 18 L 21 22" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
